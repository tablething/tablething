name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report. Please fill out the sections below so we can reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected to happen instead.
      placeholder: When I do X, Y happens, but I expected Z.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open ...
        2. Connect to ...
        3. Run ...
        4. See error
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Found under the app menu / about screen.
      placeholder: v0.1.3
    validations:
      required: true

  - type: input
    id: database
    attributes:
      label: Database type and version
      description: Which database were you connected to, if relevant?
      placeholder: PostgreSQL 16, SQLite 3.45, MySQL 8, ...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any relevant logs, error messages, or screenshots. Wrap logs in triple backticks (```) to format them.
    validations:
      required: false
